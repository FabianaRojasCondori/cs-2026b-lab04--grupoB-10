

name: Evaluacion de Prompts

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  evaluar-prompts:
    name: Evaluar prompts con capturas grabadas
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: prompts/docstrings

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias de Python
        run: python -m pip install -r requirements.txt

      - name: Instalar dependencias de Node
        run: npm ci

      - name: Ejecutar evaluacion de Promptfoo
        env:
          NODE_OPTIONS: --require=./sin-red.cjs
        run: npx --no-install promptfoo eval --no-cache -c promptfooconfig.yaml -o resultados/promptfoo.json -o resultados/promptfoo.html

