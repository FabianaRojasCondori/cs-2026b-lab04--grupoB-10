name: Evaluacion de Prompts

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluar-prompts:
    name: Evaluar prompts con capturas grabadas
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: prompts/docstrings

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias de Python
        run: python -m pip install -r requirements.txt

      - name: Instalar dependencias de Node
        run: npm ci

      - name: Tarea B (docstrings) - evaluar v3 con Promptfoo
        env:
          NODE_OPTIONS: --require=./sin-red.cjs
        run: npx --no-install promptfoo eval --no-cache -c promptfooconfig-ci.yaml -o resultados/promptfoo-ci.json -o resultados/promptfoo-ci.html

      - name: Tarea A (criterios) - evaluar v2 y v3 con Promptfoo
        env:
          NODE_OPTIONS: --require=./sin-red.cjs
        run: npx --no-install promptfoo eval --no-cache -c ../criterios/promptfooconfig-ci.yaml -o ../criterios/resultados-ci.json

      - name: Publicar reportes de evaluacion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-promptfoo
          path: |
            prompts/docstrings/resultados/promptfoo-ci.json
            prompts/docstrings/resultados/promptfoo-ci.html
            prompts/criterios/resultados-ci.json
